<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 572" width="1004" height="572" role="img" aria-labelledby="state-graph-title">
  <title id="state-graph-title">Seven sources feed five state holders: Theme, Connectivity, UserSession, ActiveUserConversations and the ConversationDetail page. UserSession passes the active user id to ActiveUserConversations. Nine readers consume their signals: ThemeToggle, ActiveUser, UserSelector, ConversationList, ConversationEmpty, the guard, MessageItem, MessageDateSeparator and MessageForm.</title>
  <style>
    text { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #1a2330; }
    .name { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
    .label { fill: #586474; }
    .accent { fill: #d94f0c; }
    .column { font-size: 10.5px; letter-spacing: 0.08em; fill: #586474; }
    .box { fill: #ffffff; stroke: #1a2330; stroke-width: 1.2; }
    .state { fill: #fdebe0; stroke: #d94f0c; stroke-width: 1.6; }
    .edge { stroke: #586474; stroke-width: 1.1; fill: none; }
    .accent-edge { stroke: #d94f0c; stroke-width: 1.6; }
    .arrow { fill: #586474; }
    .arrow-accent { fill: #d94f0c; }
  </style>
  <rect width="1004" height="572" fill="#ffffff" />
