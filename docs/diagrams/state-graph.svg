  <text class="name" x="32" y="259">GET /users</text><text class="label" x="32" y="275">through the error interceptor</text>
  <rect class="box" x="20" y="344" width="256" height="44" rx="4" />
  <text class="name" x="32" y="363">GET /conversations/{userId}</text><text class="label" x="32" y="379">through the error interceptor</text>
