  <text class="name" x="32" y="455">GET /messages/{conversationId}</text><text class="label" x="32" y="471">through the error interceptor</text>
  <rect class="box" x="20" y="492" width="256" height="44" rx="4" />
  <text class="name" x="32" y="511">Route /conversations/:id</text><text class="label" x="32" y="527">bound to the page input</text>
  <rect class="state" x="345" y="50" width="300" height="54" rx="4" />
  <text class="name" x="357" y="71">Theme</text>
  <text x="357" y="90">isDarkThemeActive</text>
  <rect class="state" x="345" y="140" width="300" height="54" rx="4" />
  <text class="name" x="357" y="161">Connectivity</text>
  <text x="357" y="180">isOnline()</text>
  <rect class="state" x="345" y="222" width="300" height="72" rx="4" />
