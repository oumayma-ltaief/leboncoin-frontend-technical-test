@if (isCompact()) {
  <div class="flex items-center gap-2">
    <p class="flex items-center gap-1.5 text-sm font-semibold text-red-700" [title]="error().message">
      <app-error-icon class="size-5 shrink-0" [errorKind]="error().kind" />
      <span class="sr-only sm:not-sr-only">{{ title() }}</span>
      <span class="sr-only">{{ error().message }}</span>
    </p>
    <button type="button" class="button-primary" (click)="retry.emit()">Try again</button>
  </div>
} @else {
  <div class="flex flex-1 flex-col items-center justify-center gap-2 p-6 text-center">
    <div class="mb-3 flex size-12 items-center justify-center rounded-full bg-red-100 text-red-600 ring-8 ring-red-50">
      <app-error-icon class="size-6" [errorKind]="error().kind" />
    </div>
    <h2 class="text-sm font-semibold text-gray-900">{{ title() }}</h2>
    <p class="max-w-xs text-sm text-gray-500">{{ error().message }}</p>
    <button type="button" class="button-primary mt-2" (click)="retry.emit()">Try again</button>
  </div>
}
