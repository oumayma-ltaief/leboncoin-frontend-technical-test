<div class="flex h-full">

    <app-conversation-list class="min-h-0 flex-1" />
  </aside>

  <section aria-label="Conversation" class="min-w-0 flex-1 flex-col bg-gray-50 md:flex" [class]="isConversationOpen() ? 'flex' : 'hidden'">
    <router-outlet />
  </section>
</div>
