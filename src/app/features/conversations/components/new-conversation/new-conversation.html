<button
  type="button"
  class="flex size-10 cursor-pointer items-center justify-center rounded-full text-content-secondary transition-colors hover:bg-brand-soft hover:text-brand-strong focus-visible:outline-2 focus-visible:outline-brand"
  aria-label="New conversation"
  title="New conversation"
  (click)="openConversationRecipientDialog()"
>
  <svg
    class="size-5"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path
      d="M16.862 4.487l1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931z"
    />
    <path d="M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
  </svg>
</button>

<app-conversation-recipient-dialog
  #conversationRecipientDialog
  [isRecipientChoiceDisabled]="isCreatingConversation()"
  [recipientList]="recipientList()"
  (recipientChosen)="startConversationWith($event)"
>
  @if (conversationCreationFailure(); as failure) {
    <app-error-message title="Couldn't create conversation" [error]="failure.error" (retry)="startConversationWith(failure.recipient)" />
  }
</app-conversation-recipient-dialog>
