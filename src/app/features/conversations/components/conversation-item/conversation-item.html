<a
  class="group relative flex items-center gap-3 px-4 py-3 transition-colors duration-200 hover:bg-gray-50 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-brand"
  routerLinkActive="bg-brand-soft hover:bg-brand-soft"
  ariaCurrentWhenActive="page"
  [routerLink]="conversationUrl()"
>
  <span
    class="absolute inset-y-2 left-0 w-1 scale-y-0 rounded-r-full bg-brand group-aria-[current=page]:scale-y-100 motion-safe:transition-transform motion-safe:duration-200"
    aria-hidden="true"
  ></span>
  <span
    class="flex size-12 shrink-0 items-center justify-center rounded-full bg-orange-100 text-base font-bold text-brand-dark group-active:scale-95 group-aria-[current=page]:bg-brand group-aria-[current=page]:text-white motion-safe:transition motion-safe:duration-200"
    aria-hidden="true"
  >
    {{ contactNickname()[0] | uppercase }}
  </span>
  <span class="flex min-w-0 flex-1 flex-col gap-0.5">
    <span class="flex items-baseline justify-between gap-2">
      <span class="truncate text-[15px] font-semibold text-gray-900">{{ contactNickname() }}</span>
      <span class="shrink-0 text-xs text-gray-500">{{ lastMessageDate() | dayLabel }}</span>
    </span>
    <span class="truncate text-sm text-gray-500">{{ conversationStarterLabel() }}</span>
  </span>
</a>
