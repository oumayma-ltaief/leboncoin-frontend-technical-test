<dialog
  #conversationRecipientDialog
  class="m-auto w-[calc(100%-2rem)] max-w-sm rounded-2xl border border-line bg-surface p-0 text-content shadow-xl backdrop:bg-backdrop"
  aria-labelledby="conversation-recipient-dialog-title"
>
  <header class="flex items-center justify-between border-b border-line py-2 pr-2 pl-4">
    <h2 id="conversation-recipient-dialog-title" class="text-base font-bold">New conversation</h2>
    <button
      type="button"
      class="flex size-10 cursor-pointer items-center justify-center rounded-full text-content-secondary transition-colors hover:bg-surface-subtle focus-visible:outline-2 focus-visible:outline-brand"
      aria-label="Close"
      (click)="closeDialog()"
    >
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </header>

  <ng-content />

  @if (recipientList().length) {
    <div class="relative mx-4 mt-4">
      <input
        #recipientSearchBox
        type="search"
        class="w-full rounded-lg border border-line bg-surface py-2 pr-10 pl-3 text-sm text-content placeholder:text-content-muted focus:border-brand focus:ring-1 focus:ring-brand focus:outline-none"
        placeholder="Search a user"
        aria-label="Search a user"
        [value]="recipientSearchTerm()"
        (input)="filterRecipientList($event)"
      />
      @if (recipientSearchTerm()) {
        <button
          type="button"
          class="absolute top-1/2 right-1.5 flex size-7 -translate-y-1/2 cursor-pointer items-center justify-center rounded-full text-content-muted transition-colors hover:bg-surface-subtle hover:text-content focus-visible:outline-2 focus-visible:outline-brand"
          aria-label="Clear search"
          (click)="clearRecipientSearchTerm()"
        >
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      }
    </div>

    @if (recipientListMatchingSearchTerm().length) {
      <ul class="flex max-h-72 flex-col overflow-y-auto p-2">
        @for (recipient of recipientListMatchingSearchTerm(); track recipient.id) {
          <li>
            <button
              type="button"
              class="flex w-full cursor-pointer items-center gap-3 rounded-xl px-2 py-2 text-left transition-colors hover:bg-surface-subtle focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-brand disabled:cursor-wait disabled:opacity-60"
              [disabled]="isRecipientChoiceDisabled()"
              (click)="recipientChosen.emit(recipient)"
            >
              <span
                class="flex size-10 shrink-0 items-center justify-center rounded-full bg-brand-tint text-sm font-bold text-brand-strong"
                aria-hidden="true"
              >
                {{ recipient.nickname[0] | uppercase }}
              </span>
              <span class="truncate text-[15px] font-semibold">{{ recipient.nickname }}</span>
            </button>
          </li>
        }
      </ul>
    } @else {
      <app-info-message title="No user found" description="Try another nickname." />
    }
  } @else {
    <app-info-message title="No one to message" description="There is no other user yet." />
  }
</dialog>
