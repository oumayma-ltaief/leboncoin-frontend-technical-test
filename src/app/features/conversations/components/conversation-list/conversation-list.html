<header class="flex h-14 shrink-0 items-center justify-between border-b border-line pr-2 pl-4">
  <h1 class="text-lg font-bold">Messages</h1>
  @if (isReadyToCreateConversation()) {
    <app-new-conversation [activeUser]="activeUser()!" />
  }
</header>

<nav class="flex flex-1 flex-col overflow-y-auto" aria-label="Conversations">
  @if (isLoading()) {
    <app-skeleton shape="conversation" itemCount="3" />
  } @else if (activeUser(); as user) {
    @if (conversationListLoadingError(); as error) {
      <app-error-message class="flex-1" title="Couldn't load conversations" [error]="error" (retry)="reloadConversationList()" />
    } @else if (conversationList().length) {
      <ul class="divide-y divide-line-subtle">
        @for (conversation of conversationList(); track conversation.id) {
          <li>
            <app-conversation-item [activeUserId]="user.id" [conversation]="conversation" />
          </li>
        }
      </ul>
    } @else {
      <app-info-message class="flex-1" title="No conversations yet" description="Start one with the button above." />
    }
  } @else {
    <app-info-message class="flex-1" title="No active user" description="Conversations will appear here once a user is active." />
  }
</nav>
