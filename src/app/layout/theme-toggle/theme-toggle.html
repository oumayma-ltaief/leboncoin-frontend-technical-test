<button
  type="button"
  class="flex size-10 cursor-pointer items-center justify-center rounded-full text-content-secondary transition-colors hover:bg-surface-subtle focus-visible:outline-2 focus-visible:outline-brand"
  [attr.aria-label]="toggleLabel()"
  [title]="toggleLabel()"
  (click)="toggleTheme()"
>
  <svg
    class="size-5 motion-safe:transition-transform motion-safe:duration-500"
    [class.rotate-180]="isDarkThemeActive()"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    @if (isDarkThemeActive()) {
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    } @else {
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    }
  </svg>
</button>
