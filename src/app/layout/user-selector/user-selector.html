@if (isLoadingUserList()) {
  <app-skeleton shape="field" tone="brand" />
} @else if (userListLoadingError(); as error) {
  <app-error-message isCompact title="Couldn't load users" [error]="error" (retry)="reloadUserList()" />
} @else if (userList().length) {
  <label for="user-selector" class="sr-only">Active user</label>
  <div class="relative w-28 max-w-full">
    <select
      id="user-selector"
      class="peer w-full cursor-pointer appearance-none rounded-lg border border-gray-200 bg-white px-3 py-2 pr-8 text-sm font-medium text-gray-700 shadow-sm transition duration-200 hover:border-brand hover:bg-brand-soft hover:text-brand-dark hover:shadow-md focus:border-orange-500 focus:outline-none focus:ring-1 focus:ring-orange-500"
      (change)="selectUser($event)"
    >
      @for (user of userList(); track user.id) {
        <option [value]="user.id" [selected]="user.id === activeUser()?.id">{{ user.nickname }}</option>
      }
    </select>
    <!-- Custom chevron icon for a more polished look -->
    <svg
      class="pointer-events-none absolute right-2 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400 peer-hover:scale-125 peer-hover:text-brand motion-safe:transition motion-safe:duration-200"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </div>
} @else {
  <app-info-message isCompact title="No users available" />
}
